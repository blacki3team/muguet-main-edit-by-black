name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Muguet Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Locate Android SDK and NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          # GitHub Actions Ubuntu runners come with NDK pre-installed
          if [ -d "$ANDROID_HOME/ndk" ]; then
            SELECTED_NDK=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -n 1)
          else
            yes | sdkmanager --licenses
            sdkmanager "ndk;26.3.11579264"
            SELECTED_NDK="$ANDROID_HOME/ndk/26.3.11579264"
          fi
          echo "Using NDK: $SELECTED_NDK"
          echo "ANDROID_NDK_HOME=$SELECTED_NDK" >> $GITHUB_ENV
          echo "NDK_HOME=$SELECTED_NDK" >> $GITHUB_ENV

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Android Native Library
        run: |
          cargo ndk -t arm64-v8a --platform 26 build --release --lib
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libmuguet.so android/app/src/main/jniLibs/arm64-v8a/

      - name: Build APK with Gradle
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace

      - name: Collect Output APK
        run: |
          mkdir -p build
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} build/gtav.apk \;
          ls -la build/gtav.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gtav-android-apk
          path: build/gtav.apk
          if-no-files-found: error
