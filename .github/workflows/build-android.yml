name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      game_zip_url:
        description: 'Optional URL to download game.zip'
        required: false
        default: ''

jobs:
  build:
    name: Build Muguet Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Download game.zip (if provided)
        if: "${{ github.event.inputs.game_zip_url != '' }}"
        run: |
          curl -L -o game.zip "${{ github.event.inputs.game_zip_url }}"

      - name: Build Android Native Library
        run: |
          chmod +x make-android.sh
          if [ -f "game.zip" ]; then
            cargo ndk -t arm64-v8a build --release --lib
          else
            cargo ndk -t arm64-v8a build --release --lib
          fi
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libmuguet.so android/app/src/main/jniLibs/arm64-v8a/

      - name: Build APK with Gradle
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace

      - name: Collect Output APK
        run: |
          mkdir -p build
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} build/gtav.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gtav.apk
          path: build/gtav.apk
          if-no-files-found: error
